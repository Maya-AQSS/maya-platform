name: CI — JS

on:
  pull_request:
    paths:
      - 'packages/js/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-js.yml'
  push:
    branches: [main, develop]
    paths:
      - 'packages/js/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-js.yml'

jobs:
  test:
    name: Test JS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --filter='./packages/js/*' typecheck

      - name: Test
        run: pnpm -r --filter='./packages/js/*' test

      - name: Build
        run: pnpm -r --filter='./packages/js/*' build
