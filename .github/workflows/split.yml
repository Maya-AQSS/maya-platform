name: Split packages to read-only repos

# Triggered on every push to main and on every tag. The split is what makes
# `Maya-AQSS/shared-auth-laravel` (and siblings) usable as standalone repos
# that consumers can require via Composer/npm.
#
# REQUIRES org-level secret SPLIT_TOKEN (a fine-grained PAT with `contents:write`
# on every Maya-AQSS/shared-* target repo).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  matrix:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.list.outputs.php }}
      js: ${{ steps.list.outputs.js }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          php=$(ls -1 packages/php | jq -R -s -c 'split("\n") | map(select(length > 0))')
          js=$(ls -1 packages/js  | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "js=$js"  >> "$GITHUB_OUTPUT"

  split-php:
    name: Split ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.php) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split via splitsh/lite
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          branch: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          package_directory: 'packages/php/${{ matrix.package }}'
          repository_organization: 'Maya-AQSS'
          repository_name: '${{ matrix.package }}'
          user_name: 'maya-platform-bot'
          user_email: 'bot@maya-aqss.org'

  split-js:
    name: Split ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.js) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split via splitsh/lite
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          branch: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          package_directory: 'packages/js/${{ matrix.package }}'
          repository_organization: 'Maya-AQSS'
          repository_name: '${{ matrix.package }}'
          user_name: 'maya-platform-bot'
          user_email: 'bot@maya-aqss.org'
