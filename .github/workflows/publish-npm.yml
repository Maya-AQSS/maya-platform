name: Publish JS packages to npm

# Triggered on tag push. Each tag matching v*.*.* publishes every JS package
# under @ceedcv-maya/* to the public npm registry.
#
# REQUIRES org-level secret NPM_TOKEN (an npm automation token with publish
# rights on the @ceedcv-maya scope).
#
# PHP packages are published to Packagist via its GitHub webhook integration
# (no CI action needed — Packagist auto-detects new tags on each split repo).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pass --dry-run to npm publish (no actual upload)'
        required: false
        default: 'true'
        type: string

jobs:
  matrix:
    name: Discover JS packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          packages=$(ls -1 packages/js | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ceedcv-maya'

      - name: Verify version matches tag
        if: github.event_name == 'push'
        working-directory: packages/js/${{ matrix.package }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version in ${{ matrix.package }}"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $pkg_version ✓"

      - name: Publish
        working-directory: packages/js/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dry="${{ inputs.dry_run }}"
          if [ "$dry" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi
