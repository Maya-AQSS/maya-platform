name: Publish JS packages to npm

# Triggered on tag push. Each tag matching v*.*.* publishes every JS package
# under @ceedcv-maya/* to the public npm registry.
#
# The git tag is the single source of truth for the published version: the
# "Stamp version from tag" step rewrites each package.json (own version + internal
# @ceedcv-maya/* ranges) to the tag version right before publishing. So even a tag
# pushed by hand (or one where the committed JS versions drifted) can never leave
# npm desynced. release.yml keeps the committed tree in sync for the normal path.
#
# REQUIRES org-level secret NPM_TOKEN (an npm automation token with publish
# rights on the @ceedcv-maya scope).
#
# PHP packages are published to Packagist via its GitHub webhook integration
# (no CI action needed — Packagist auto-detects new tags on each split repo).
#
# The `workflow_call` trigger lets release.yml invoke this within the same run
# after it creates the tag. That is the reliable path: a tag pushed by the
# release job's GITHUB_TOKEN does NOT trigger `on: push` workflows (GitHub's
# recursion guard), so the push trigger below only fires for hand-pushed tags.

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (no leading v), e.g. 0.11.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pass --dry-run to npm publish (no actual upload)'
        required: false
        default: 'true'
        type: string

jobs:
  matrix:
    name: Discover JS packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          packages=$(ls -1 packages/js | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # When called by release.yml, check out the freshly created tag so we
          # publish the released tree. For a tag push, github.ref already is the
          # tag; for workflow_dispatch it stays on the dispatched branch.
          ref: ${{ github.event_name == 'workflow_call' && format('v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ceedcv-maya'

      - name: Stamp version
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/js/${{ matrix.package }}
        env:
          TAG_VERSION: ${{ github.event_name == 'workflow_call' && inputs.version || github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.TAG_VERSION.replace(/^v/, "");
            const range = "^" + version;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            for (const key of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = pkg[key];
              if (!deps) continue;
              for (const name of Object.keys(deps)) {
                if (name.startsWith("@ceedcv-maya/") && !String(deps[name]).startsWith("workspace:")) {
                  deps[name] = range;
                }
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("Stamped " + pkg.name + " -> " + version);
          '

      - name: Publish
        working-directory: packages/js/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          dry="${{ inputs.dry_run }}"
          if [ "$dry" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi
